name: Run unit and mutation tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit and mutation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true

      - name: Unit tests
        run: pnpm test -- --testPathIgnorePatterns=".*\.fuzz\.test\.ts"

      - name: Mutation tests
        run: npx stryker run
